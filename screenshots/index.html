<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>HashGuard current UI screenshots</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#111;color:#eee}
h1{font-size:18px}
.grid{display:grid;gap:24px}
figure{margin:0;background:#1a1a1a;padding:12px;border-radius:8px}
figcaption{font-size:13px;margin-bottom:8px;color:#bbb;font-family:ui-monospace,monospace}
img{max-width:100%;height:auto;border:1px solid #333}
a{color:#8cf}
</style></head><body>
<h1>HashGuard — current UI (before design changes)</h1>
<p>Layout mockups from MainForm code. Not live EXE captures. <a href="../mockups/hashguard-current.html">Open interactive HTML</a></p>
<div class="grid" id="g"></div>
<script>
const shots=[
'01-prescan-not-protected.png',
'02-scanning.png',
'03-clean-protected.png',
'04-action-needed-queue.png',
'05-dark-protected.png',
'00-all-states-overview.png'
];
const g=document.getElementById('g');
for(const s of shots){
  const f=document.createElement('figure');
  f.innerHTML=`<figcaption>${s}</figcaption><a href="${s}" target="_blank"><img src="${s}" alt="${s}"></a>`;
  g.appendChild(f);
}
</script>
</body></html>
